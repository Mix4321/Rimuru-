name: Build MOVE Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare debug keystore and env
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Prepare google-services.json from Secret if missing
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import sys

          target = "app/google-services.json"
          if os.path.exists(target):
              print("app/google-services.json already exists.")
              sys.exit(0)

          raw_json = (os.environ.get("GOOGLE_SERVICES_JSON") or "").strip()
          raw_b64 = (os.environ.get("GOOGLE_SERVICES_JSON_BASE64") or "").strip()

          def try_parse_json(text: str):
              cleaned = text.lstrip("\ufeff").strip()
              if not cleaned:
                  return None
              try:
                  obj = json.loads(cleaned)
                  if isinstance(obj, dict):
                      return json.dumps(obj, ensure_ascii=False, indent=2) + "\n"
              except Exception:
                  pass
              return None

          def try_decode_b64(text: str):
              if ";base64," in text:
                  text = text.split(";base64,", 1)[1]
              text = re.sub(r"-----BEGIN [^-]+-----|-----END [^-]+-----", "", text)
              cleaned = re.sub(r"\s+", "", text).strip("\"'")
              cleaned = cleaned.replace("-", "+").replace("_", "/")
              cleaned = re.sub(r"[^A-Za-z0-9+/=]", "", cleaned).rstrip("=")
              if not cleaned:
                  return None
              cleaned += "=" * ((-len(cleaned)) % 4)
              try:
                  raw_bytes = base64.b64decode(cleaned)
              except Exception:
                  return None
              for encoding in ("utf-8-sig", "utf-16", "utf-16-le"):
                  try:
                      parsed = try_parse_json(raw_bytes.decode(encoding))
                      if parsed:
                          return parsed
                  except Exception:
                      pass
              return None

          result = None
          if raw_json:
              result = try_parse_json(raw_json) or try_decode_b64(raw_json)
              if not result:
                  print("::warning::GOOGLE_SERVICES_JSON is set but could not be parsed as valid JSON. Continuing build without google-services.json.")

          if not result and raw_b64:
              result = try_parse_json(raw_b64) or try_decode_b64(raw_b64)
              if not result:
                  print("::warning::GOOGLE_SERVICES_JSON_BASE64 is set but is neither valid Base64-encoded JSON nor raw JSON. Continuing build without google-services.json.")

          if result:
              with open(target, "w", encoding="utf-8") as f:
                  f.write(result)
              print(f"Prepared {target} from GitHub Secret.")
          else:
              print("Proceeding without app/google-services.json (APK will still compile).")
          PY

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOVE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
