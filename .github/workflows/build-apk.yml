name: Build MOVE Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare debug keystore and env
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          import subprocess

          if not os.path.exists("debug.keystore"):
              b64_source = ""
              if os.path.exists("debug.keystore.base64"):
                  with open("debug.keystore.base64", "r", encoding="utf-8", errors="ignore") as f:
                      b64_source = f.read()
                  print("Decoding debug.keystore from debug.keystore.base64 in repository.")
              elif os.environ.get("DEBUG_KEYSTORE_BASE64"):
                  b64_source = os.environ["DEBUG_KEYSTORE_BASE64"]
                  print("Decoding debug.keystore from DEBUG_KEYSTORE_BASE64 GitHub Secret.")

              if b64_source:
                  cleaned = re.sub(r"\s+", "", b64_source).strip("\"'")
                  cleaned = cleaned.replace("-", "+").replace("_", "/")
                  cleaned = re.sub(r"[^A-Za-z0-9+/=]", "", cleaned).rstrip("=")
                  cleaned += "=" * ((-len(cleaned)) % 4)
                  try:
                      with open("debug.keystore", "wb") as out:
                          out.write(base64.b64decode(cleaned))
                  except Exception as exc:
                      print(f"::warning::Failed to decode debug.keystore base64 ({exc}); generating fallback debug.keystore.")
                      if os.path.exists("debug.keystore"):
                          os.remove("debug.keystore")

          if not os.path.exists("debug.keystore"):
              print("::warning::Neither debug.keystore.base64 nor DEBUG_KEYSTORE_BASE64 secret was found. Generating a new debug.keystore (Google Sign-In requires its SHA-1 to be registered in Firebase Console).")
              subprocess.run(
                  [
                      "keytool", "-genkeypair", "-v",
                      "-keystore", "debug.keystore",
                      "-storepass", "android",
                      "-alias", "androiddebugkey",
                      "-keypass", "android",
                      "-keyalg", "RSA",
                      "-keysize", "2048",
                      "-validity", "10000",
                      "-dname", "CN=Android Debug,O=Android,C=US",
                  ],
                  check=True,
              )
          PY
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Prepare google-services.json from Secret if missing
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import sys

          target = "app/google-services.json"
          if os.path.exists(target):
              print("app/google-services.json already exists.")
              sys.exit(0)

          raw_json = (os.environ.get("GOOGLE_SERVICES_JSON") or "").strip()
          raw_b64 = (os.environ.get("GOOGLE_SERVICES_JSON_BASE64") or "").strip()

          def try_parse_json(text: str):
              cleaned = text.lstrip("\ufeff").strip()
              if not cleaned:
                  return None
              try:
                  obj = json.loads(cleaned)
                  if isinstance(obj, dict):
                      return json.dumps(obj, ensure_ascii=False, indent=2) + "\n"
              except Exception:
                  pass
              return None

          def try_decode_b64(text: str):
              if ";base64," in text:
                  text = text.split(";base64,", 1)[1]
              text = re.sub(r"-----BEGIN [^-]+-----|-----END [^-]+-----", "", text)
              cleaned = re.sub(r"\s+", "", text).strip("\"'")
              cleaned = cleaned.replace("-", "+").replace("_", "/")
              cleaned = re.sub(r"[^A-Za-z0-9+/=]", "", cleaned).rstrip("=")
              if not cleaned:
                  return None
              cleaned += "=" * ((-len(cleaned)) % 4)
              try:
                  raw_bytes = base64.b64decode(cleaned)
              except Exception:
                  return None
              for encoding in ("utf-8-sig", "utf-16", "utf-16-le"):
                  try:
                      parsed = try_parse_json(raw_bytes.decode(encoding))
                      if parsed:
                          return parsed
                  except Exception:
                      pass
              return None

          result = None
          if raw_json:
              result = try_parse_json(raw_json) or try_decode_b64(raw_json)
              if not result:
                  print("::warning::GOOGLE_SERVICES_JSON is set but could not be parsed as valid JSON. Continuing build without google-services.json.")

          if not result and raw_b64:
              result = try_parse_json(raw_b64) or try_decode_b64(raw_b64)
              if not result:
                  print("::warning::GOOGLE_SERVICES_JSON_BASE64 is set but is neither valid Base64-encoded JSON nor raw JSON. Continuing build without google-services.json.")

          if result:
              with open(target, "w", encoding="utf-8") as f:
                  f.write(result)
              print(f"Prepared {target} from GitHub Secret.")
          else:
              print("Proceeding without app/google-services.json (APK will still compile).")
          PY

      - name: Verify APK signing SHA-1 matches google-services.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          out = subprocess.check_output(
              [
                  "keytool", "-list", "-v",
                  "-keystore", "debug.keystore",
                  "-storepass", "android",
                  "-alias", "androiddebugkey",
              ],
              text=True,
              stderr=subprocess.STDOUT,
          )
          sha1_match = re.search(r"SHA1:\s*([0-9A-Fa-f:]+)", out)
          sha256_match = re.search(r"SHA256:\s*([0-9A-Fa-f:]+)", out)
          sha1_colon = sha1_match.group(1).upper() if sha1_match else ""
          sha1_hex = sha1_colon.replace(":", "").lower()
          print(f"Debug APK SHA-1:   {sha1_colon}")
          if sha256_match:
              print(f"Debug APK SHA-256: {sha256_match.group(1).upper()}")

          gs_path = "app/google-services.json"
          if os.path.exists(gs_path) and sha1_hex:
              with open(gs_path, "r", encoding="utf-8") as f:
                  gs = json.load(f)
              registered = set()
              for client in gs.get("client", []):
                  for oauth in client.get("oauth_client", []):
                      cert = oauth.get("android_info", {}).get("certificate_hash", "")
                      if cert:
                          registered.add(cert.replace(":", "").lower())
              if registered and sha1_hex not in registered:
                  print(
                      f"::warning::APK SHA-1 ({sha1_colon}) does NOT match certificate_hash in app/google-services.json ({', '.join(sorted(registered))}). "
                      "Google Sign-In will fail with '[16] Account reauth failed' or 'package certificate hash'. "
                      "Fix: Add DEBUG_KEYSTORE_BASE64 (from debug.keystore.base64) to GitHub Secrets, or add this SHA-1 in Firebase Console."
                  )
          PY

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOVE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
